name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SDL2_VERSION: 2.30.9

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar SDL2
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          Write-Host "Descargando $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sdl2.zip"
          Expand-Archive "$env:RUNNER_TEMP\sdl2.zip" -DestinationPath "$env:RUNNER_TEMP\sdl2" -Force
          "SDL2_DIR=$env:RUNNER_TEMP\sdl2\SDL2-$env:SDL2_VERSION" >> $env:GITHUB_ENV

      - name: Configurar CMake
        shell: pwsh
        run: |
          # Los argumentos van en un array para que PowerShell no parta nada.
          $cmakeArgs = @(
            '-S', 'src/bwapi',
            '-B', 'build',
            '-A', 'x64',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
            "-DOPENBW_DIR=${{ github.workspace }}/src/openbw",
            '-DOPENBW_ENABLE_UI=ON',
            "-DSDL2_INCLUDE_DIR=$env:SDL2_DIR/include",
            "-DSDL2_LIBRARY=$env:SDL2_DIR/lib/x64/SDL2.lib"
          )
          $out = & cmake @cmakeArgs 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath "$env:RUNNER_TEMP\configure.log"
          if ($code -ne 0) { exit $code }

      - name: Compilar
        shell: pwsh
        run: |
          $out = & cmake --build build --config Release --parallel 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log"
          if ($code -ne 0) { exit $code }

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/*.exe dist/
          Copy-Item build/bin/*.dll dist/
          Copy-Item "$env:SDL2_DIR/lib/x64/SDL2.dll" dist/
          Get-ChildItem dist | Format-Table Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } }

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: openbw-win64
          path: dist/
          if-no-files-found: error

      # Si algo falla, dejamos el log en el resumen del job y en el repo:
      # /actions/jobs/<id>/logs exige autenticacion, el repo no.
      - name: Resumen del error
        if: failure()
        shell: pwsh
        run: |
          $parts = @()
          foreach ($f in @('configure.log', 'build.log')) {
            $p = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $p) {
              $lines = Get-Content $p
              $tail = $lines | Select-Object -Last 200
              $parts += "### $f (ultimas $($tail.Count) de $($lines.Count) lineas)"
              $parts += '```'
              $parts += $tail
              $parts += '```'
            }
          }
          if ($parts.Count -eq 0) { $parts = @('No se genero ningun log.') }
          $summary = $parts -join "`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Set-Content -Path "ci-last-error.md" -Value $summary -Encoding utf8

      # Los push hechos con GITHUB_TOKEN no vuelven a disparar workflows: no hay bucle.
      - name: Guardar log en el repositorio
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path "ci-last-error.md")) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-last-error.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: log del ultimo error [skip ci]"
            git push
          }
